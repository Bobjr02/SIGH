name: SIGH Frontend CI

on:
  push:
    branches: [ main, master, release/*, develop ]
    paths:
      - 'SIGH/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'SIGH/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, Test & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIGH/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SIGH/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit & Component Tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Check Entry Bundle Size (< 500 kB)
        run: npm run check:bundle

  docker-image:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build image (Node 24 + nginx sem root)
        run: docker build -t sigh-web:ci SIGH/frontend

      - name: Smoke test (SPA, fallback, headers de segurança, sem root)
        run: |
          # Upstream por IP: o nginx sobe sem precisar resolver o serviço "api".
          docker run -d --name sigh-web -p 8080:8080 -e SIGH_API_UPSTREAM=http://127.0.0.1:9 sigh-web:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done
          test "$(docker exec sigh-web id -u)" = "101"
          headers="$(curl -fsI http://localhost:8080/medidas/rota-qualquer)"
          echo "$headers"
          echo "$headers" | grep -qi "content-security-policy: .*frame-ancestors 'none'"
          echo "$headers" | grep -qi "x-content-type-options: nosniff"
          echo "$headers" | grep -qi "referrer-policy:"
          echo "$headers" | grep -qi "cache-control: no-cache"
          asset="$(curl -fs http://localhost:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)"
          curl -fsI "http://localhost:8080${asset}" | grep -qi "cache-control: public, max-age=31536000, immutable"

      - name: Logs do container (em caso de falha)
        if: failure()
        run: docker logs sigh-web || true
