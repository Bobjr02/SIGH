name: SIGH Frontend CI

on:
  push:
    branches: [ main, master, release/*, develop ]
    paths:
      - 'SIGH/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'SIGH/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, Test & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIGH/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SIGH/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit & Component Tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Check Entry Bundle Size (< 500 kB)
        run: npm run check:bundle
