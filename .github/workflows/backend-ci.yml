name: SIGH Backend CI

on:
  push:
    branches: [ main, master, release/*, develop ]
    paths:
      - 'SIGH/backend/**'
      - 'SIGH/frontend/src/auth/permission-codes.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'SIGH/backend/**'
      - 'SIGH/frontend/src/auth/permission-codes.json'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Backend (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: 'SIGH/backend/global.json'

      - name: Restore Dependencies
        run: dotnet restore SIGH/backend/SIGH.sln

      - name: Build Solution (Release)
        run: dotnet build SIGH/backend/SIGH.sln --configuration Release --no-restore

      # O tool manifest fica em SIGH/backend/.config, por isso o passo roda a partir de SIGH/backend.
      - name: Check EF Core Model vs Migrations
        working-directory: SIGH/backend
        run: dotnet tool restore && dotnet ef migrations has-pending-model-changes -p src/SIGH.Persistence -s src/SIGH.Api

      - name: Run Unit Tests
        run: |
          dotnet test SIGH/backend/tests/SIGH.UnitTests/SIGH.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory SIGH/backend/TestResults \
            --collect:"XPlat Code Coverage"

      # Testcontainers sobe um SQL Server real (mcr.microsoft.com/mssql/server:2022-latest)
      # no Docker do runner; o schema vem das migrations.
      - name: Run Integration Tests (SQL Server via Testcontainers)
        run: |
          dotnet test SIGH/backend/tests/SIGH.IntegrationTests/SIGH.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory SIGH/backend/TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload Test Results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: SIGH/backend/TestResults/*.trx
          retention-days: 14

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: SIGH/backend/TestResults/**/coverage.cobertura.xml
          retention-days: 14

  docker-image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Garante que SIGH/backend/Dockerfile continua compilando (contexto = raiz do repositório).
      - name: Build Docker Image
        run: docker build --file SIGH/backend/Dockerfile --tag sigh-api:ci .
