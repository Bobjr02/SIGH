name: SIGH E2E

# Suíte e2e (SIGH/frontend/e2e, Playwright + Chromium) contra a stack EM CONTAINERS
# (compose.app.yml + compose.e2e.yml), com segredos gerados no próprio job (scripts/e2e-stack.sh).
on:
  # Na main, só quando muda algo que a suíte exercita (o PR já rodou o e2e antes do merge).
  push:
    branches: [ main ]
    paths:
      - 'SIGH/**'
      - 'compose.app.yml'
      - 'compose.e2e.yml'
      - 'scripts/e2e-stack.sh'
      - '.github/workflows/e2e.yml'
  # Em TODO PR para a main, sem filtro de caminhos: o check "E2E (Playwright, Chromium)" sempre aparece e pode ser
  # obrigatório na proteção da branch (com filtro, um PR só de docs ficaria esperando um check que nunca roda).
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Nome do check no PR (é este o nome a marcar como obrigatório na proteção da main).
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SIGH/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: SIGH/frontend
        run: npm ci

      - name: Install Chromium (Playwright)
        working-directory: SIGH/frontend
        run: npx playwright install --with-deps chromium

      # Sobe a stack (build das imagens da API e do web), roda a suíte e desmonta tudo, passando ou falhando.
      # Os segredos (sa, JWT, admin) são aleatórios e só existem neste job.
      - name: Run E2E against the compose stack
        run: scripts/e2e-stack.sh

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            SIGH/frontend/playwright-report/
            SIGH/frontend/test-results/
          retention-days: 14
